name: CI and Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  build:
    name: Build and Test (Windows)
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Install MAUI workload
      run: dotnet workload install maui-windows --skip-sign-check

    - name: Restore dependencies
      run: dotnet restore Source/HopTracer.sln

    - name: Build
      run: dotnet build Source/HopTracer.sln --configuration Release --no-restore

    - name: Run Tests
      run: dotnet test Tests/HopTracer.UnitTests/HopTracer.UnitTests.csproj --configuration Release --no-build

    - name: Publish Portable Package
      run: |
        dotnet publish Source/HopTracer/HopTracer.csproj `
          -f net10.0-windows10.0.19041.0 `
          -c Release `
          -r win-x64 `
          -p:WindowsPackageType=None `
          -p:WindowsAppSDKSelfContained=true `
          -p:SelfContained=true `
          -p:PublishSingleFile=false `
          -o ./Release/HopTracer_Portable
      shell: pwsh

    - name: Create Release Archive
      run: Compress-Archive -Path ./Release/HopTracer_Portable/* -DestinationPath ./Release/HopTracer-Windows-x64.zip -Force
      shell: pwsh

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: HopTracer-Windows-x64
        path: ./Release/HopTracer-Windows-x64.zip
        retention-days: 30

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    
    steps:
    - name: Download Artifact
      uses: actions/download-artifact@v4
      with:
        name: HopTracer-Windows-x64
        path: ./artifacts

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: ./artifacts/HopTracer-Windows-x64.zip
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

