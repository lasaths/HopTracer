name: Linux CI

on:
  push:
    branches: [ main, 'cursor/**' ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build CLI
      run: dotnet build Source/Tools/GhDiffTool/GhDiffTool.csproj -c Release
    
    - name: Run tests
      run: dotnet test Tests/HopTracer.UnitTests/HopTracer.UnitTests.csproj -c Release --no-build
    
    - name: Test CLI
      run: |
        CLI=./Source/Tools/GhDiffTool/bin/Release/net10.0/hoptracer
        $CLI compare Tests/data/SampleDefinition.ghx Tests/data/SampleDefinition_Modified.ghx -f agent --no-timestamp > /tmp/test.json
        test $(jq -r '.schema' < /tmp/test.json) = "hoptracer.agent/2"
