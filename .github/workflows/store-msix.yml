name: Build Store MSIX

on:
  workflow_dispatch:
    inputs:
      identity_name:
        description: "Partner Center package identity name"
        required: true
        default: "lasaths.HopTracer"
        type: string
      version:
        description: "ApplicationDisplayVersion (example: 1.2.0)"
        required: false
        default: "1.2.0"
        type: string
      package_version:
        description: "MSIX PackageVersion (example: 1.2.0.0)"
        required: false
        default: "1.2.0.0"
        type: string
      publisher:
        description: "Partner Center publisher subject"
        required: true
        default: "CN=AFE48087-3FFA-435C-A8A2-1776FA3FFA25"
        type: string
      require_store_readiness:
        description: "Fail build if Store identity or packaging metadata are not aligned"
        required: true
        default: true
        type: boolean
      sign_package:
        description: "Sign package with certificate secrets"
        required: true
        default: false
        type: boolean
      attach_to_release:
        description: "Attach MSIX upload package to GitHub release v{version}"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.x"

jobs:
  msix:
    name: Build MSIX (Windows)
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        cache: false

    - name: Install MAUI workload
      run: dotnet workload install maui-windows --skip-sign-check

    - name: Prepare certificate
      if: ${{ inputs.sign_package }}
      shell: pwsh
      env:
        MSIX_CERT_BASE64: ${{ secrets.MSIX_CERT_BASE64 }}
      run: |
        if (-not $env:MSIX_CERT_BASE64) {
          throw "sign_package=true but secret MSIX_CERT_BASE64 is not configured."
        }
        $certPath = Join-Path $env:RUNNER_TEMP "store-signing-cert.pfx"
        [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:MSIX_CERT_BASE64))
        "MSIX_CERT_PATH=$certPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Build unsigned MSIX
      if: ${{ !inputs.sign_package }}
      shell: pwsh
      env:
        REQUIRE_STORE_READINESS: ${{ inputs.require_store_readiness }}
      run: |
        $requireReadiness = [System.Convert]::ToBoolean($env:REQUIRE_STORE_READINESS)
        ./scripts/build_msix.ps1 `
          -SkipClean:$false `
          -SkipTests:$false `
          -RequireStoreReadiness:$requireReadiness `
          -IdentityName "${{ inputs.identity_name }}" `
          -Version "${{ inputs.version }}" `
          -PackageVersion "${{ inputs.package_version }}" `
          -Publisher "${{ inputs.publisher }}"

    - name: Build signed MSIX
      if: ${{ inputs.sign_package }}
      shell: pwsh
      env:
        REQUIRE_STORE_READINESS: ${{ inputs.require_store_readiness }}
      run: |
        if (-not "${{ secrets.MSIX_CERT_PASSWORD }}") {
          throw "sign_package=true but secret MSIX_CERT_PASSWORD is not configured."
        }
        $requireReadiness = [System.Convert]::ToBoolean($env:REQUIRE_STORE_READINESS)
        ./scripts/build_msix.ps1 `
          -SkipClean:$false `
          -SkipTests:$false `
          -RequireStoreReadiness:$requireReadiness `
          -IdentityName "${{ inputs.identity_name }}" `
          -Version "${{ inputs.version }}" `
          -PackageVersion "${{ inputs.package_version }}" `
          -Publisher "${{ inputs.publisher }}" `
          -CertificatePath "$env:MSIX_CERT_PATH" `
          -CertificatePassword "${{ secrets.MSIX_CERT_PASSWORD }}"

    - name: Upload MSIX artifacts
      uses: actions/upload-artifact@v4
      with:
        name: HopTracer-MSIX
        path: |
          Release/MSIX/**/*.msix
          Release/MSIX/**/*.msixupload
        retention-days: 90

  attach-release:
    name: Attach to GitHub Release
    needs: msix
    if: ${{ inputs.attach_to_release && inputs.version != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v7

    - name: Download MSIX artifact
      uses: actions/download-artifact@v4
      with:
        name: HopTracer-MSIX
        path: ./msix

    - name: Upload to GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        UPLOAD=$(find ./msix -name '*.msixupload' | head -n 1)
        if [ -z "$UPLOAD" ]; then
          UPLOAD=$(find ./msix -name '*.msix' | head -n 1)
        fi
        if [ -z "$UPLOAD" ]; then
          echo "No MSIX package found in artifact"
          exit 1
        fi
        TAG="v${{ inputs.version }}"
        echo "Uploading $UPLOAD to release $TAG"
        gh release upload "$TAG" "$UPLOAD" --clobber
