name: Feature request
description: Suggest an improvement for HopTracer
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What workflow pain point are you trying to solve?
      placeholder: Describe the current limitation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should HopTracer do?
      placeholder: Describe your preferred behavior or UI.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches or workarounds you tried.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, references, or related issues.
