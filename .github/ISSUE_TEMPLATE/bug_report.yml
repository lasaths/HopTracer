name: Bug report
description: Report a reproducible problem in HopTracer
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened and what did you expect?
      placeholder: A short description of the issue.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide a minimal sequence to reproduce.
      placeholder: |
        1. Open ...
        2. Load ...
        3. Click ...
        4. Observe ...
    validations:
      required: true
  - type: textarea
    id: sample_files
    attributes:
      label: Sample files
      description: Attach or describe the `.gh`/`.ghx` files used if possible.
  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      description: Paste relevant logs or screenshots.
      render: shell
  - type: input
    id: version
    attributes:
      label: HopTracer version
      placeholder: e.g. v1.0.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Windows version
      placeholder: e.g. Windows 11 24H2
    validations:
      required: true
