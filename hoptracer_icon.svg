<svg width="512" height="512" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#b59dd9;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8fb8ce;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#69d3c3;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <rect width="100" height="100" fill="#1a1b26"/>
  
  <!-- Continuous Ribbon Path -->
  <!-- Tracing the centerline of the ribbon -->
  <path d="
    M 30, 25
    L 30, 75
    A 10,10 0 0 0 50, 75
    L 70, 25
    A 10,10 0 0 1 90, 25
    L 90, 75
    A 10,10 0 0 1 70, 75
    L 50, 25
    A 10,10 0 0 0 30, 25
    Z
  " 
  fill="none" 
  stroke="url(#ribbonGrad)" 
  stroke-width="14" 
  stroke-linecap="round" 
  stroke-linejoin="round"
  filter="url(#shadow)"
  />
  
</svg>
