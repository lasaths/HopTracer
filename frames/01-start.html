<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HopTracer</title><link rel="stylesheet" href="tokens.css"><style>
.home{display:grid;grid-template-columns:1fr 400px;height:calc(100vh - 56px - 56px)}
.home .l{padding:64px 64px 32px var(--m);display:flex;flex-direction:column;min-width:0}
.home .r{padding:64px var(--m) 32px 32px;box-shadow:-1px 0 0 var(--c-surface-hover)}
.slots{display:grid;grid-template-columns:1fr 48px 1fr;gap:0;margin-top:48px;align-items:stretch}
.slot{min-height:208px;padding:24px;display:flex;flex-direction:column;gap:8px;outline:1px dashed var(--c-line);outline-offset:-1px}
.slot.filled{outline:1px solid var(--c-line);background:var(--c-surface)}
.slot.drag{outline:2px solid var(--c-ultra);outline-offset:-2px}
.slot .big{font-size:18px;line-height:24px;font-weight:500}
.mid{display:flex;align-items:center;justify-content:center;color:var(--c-muted)}
.rec button{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;padding:12px 0;box-shadow:0 1px 0 var(--c-surface-hover)}
.commits{margin-top:8px}
.commits .cr{display:grid;grid-template-columns:16px 72px 1fr auto;gap:12px;align-items:center;height:36px;padding:0 8px 0 6px;border-left:2px solid transparent}
.commits .cr.on{border-left-color:var(--c-ultra);background:var(--c-surface-hover)}
.stage{display:grid;grid-template-columns:24px 1fr auto;align-items:center;height:40px;box-shadow:0 1px 0 var(--c-surface-hover)}
.prog{height:2px;background:var(--c-line);margin-top:24px;position:relative}
.prog i{position:absolute;left:0;top:0;bottom:0;background:var(--c-text)}
foot.simple{}

.col{width:var(--col);flex:none;padding:16px var(--m) 24px 32px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.col section+section{margin-top:32px}
.dtabs{display:flex;gap:16px;height:40px;align-items:stretch;margin-bottom:16px}
.dtabs button{color:var(--c-muted);border-bottom:var(--accent) solid transparent;display:flex;align-items:center;gap:6px}
.dtabs button[aria-selected=true]{color:var(--c-text);border-bottom-color:var(--c-text)}
.kv{display:grid;grid-template-columns:112px 1fr;column-gap:16px;row-gap:0}
.kv>*{min-height:28px;display:flex;align-items:center;min-width:0}
.kv>.k{font-family:var(--f-mono);font-weight:500;font-size:var(--t-label);letter-spacing:var(--t-track);text-transform:uppercase;color:var(--c-muted)}
.risklist button{display:flex;align-items:flex-start;gap:8px;width:100%;text-align:left;padding:8px 0;box-shadow:0 1px 0 var(--c-surface-hover)}
.rbar{display:flex;height:8px;gap:2px;margin-top:16px}
.rbar i{display:block;height:100%}
.back{display:flex;align-items:center;gap:8px;height:32px;color:var(--c-muted)}
.fact{display:flex;align-items:baseline;gap:8px}
.files{display:grid;grid-template-columns:56px minmax(0,1fr) auto;column-gap:12px}.files>*{line-height:28px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:6px}
</style></head>
