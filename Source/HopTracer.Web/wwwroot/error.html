<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - HopTracer</title>
    <link rel="icon" type="image/png" href="/images/HopTrace_Logo.png">
    <style>
        :root {
            /* Shadcn Dark Theme (Zinc/Slate) */
            --radius: 0.65rem;
            --background: oklch(0.141 0.005 285.823);
            --foreground: oklch(0.985 0 0);
            --card: oklch(0.21 0.006 285.885);
            --card-foreground: oklch(0.985 0 0);
            --popover: oklch(0.21 0.006 285.885);
            --popover-foreground: oklch(0.985 0 0);
            --primary: oklch(0.606 0.25 292.717);
            --primary-foreground: oklch(0.969 0.016 293.756);
            --secondary: oklch(0.274 0.006 286.033);
            --secondary-foreground: oklch(0.985 0 0);
            --muted: oklch(0.274 0.006 286.033);
            --muted-foreground: oklch(0.705 0.015 286.067);
            --accent: oklch(0.274 0.006 286.033);
            --accent-foreground: oklch(0.985 0 0);
            --destructive: oklch(0.704 0.191 22.216);
            --border: oklch(1 0 0 / 10%);
            --input: oklch(1 0 0 / 15%);
            --ring: oklch(0.38 0.189 293.745);

            --bg-app: var(--background);
            --bg-panel: var(--card);
            --text-primary: var(--foreground);
            --text-secondary: var(--muted-foreground);
            --accent-color: var(--primary);
            --accent-hover: var(--ring);
            --danger: #f44336;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Geist Sans", "Space Grotesk", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
            background-color: var(--bg-app);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 16px;
        }

        .container {
            width: min(600px, calc(100vw - 32px));
            max-width: 100%;
            text-align: center;
            background: var(--bg-panel);
            padding: clamp(24px, 5vw, 40px);
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        .btn:focus-visible {
            outline: 2px solid var(--ring);
            outline-offset: 2px;
        }

        h1 {
            margin: 0 0 20px 0;
            font-size: 24px;
            font-weight: 700;
            color: var(--danger);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .error-icon {
            width: 32px;
            height: 32px;
        }

        .error-message {
            margin-bottom: 30px;
            font-size: 16px;
            line-height: 1.6;
            color: var(--text-secondary);
            background: rgba(244, 67, 54, 0.1);
            padding: 16px;
            border-radius: 8px;
            border: 1px solid rgba(244, 67, 54, 0.2);
            font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
            word-break: break-all;
        }

        .btn {
            background: var(--accent-color);
            color: var(--primary-foreground);
            border: none;
            padding: 12px 32px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            text-decoration: none;
            display: inline-block;
        }

        .btn:hover {
            background: var(--accent-hover);
        }
    </style>
</head>

<body>
    <main class="container" aria-labelledby="error-title">
        <h1 id="error-title">
            <svg class="error-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z">
                </path>
            </svg>
            Oops! Something went wrong
        </h1>

        <div class="error-message">
            {error_message}
        </div>

        <a href="/" class="btn">Back to Home</a>
    </main>
</body>

</html>
