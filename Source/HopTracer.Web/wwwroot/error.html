<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - HopTracer</title>
    <link rel="icon" type="image/png" href="/images/HopTrace_Logo.png">
    
    <!-- ANDURA Design System -->
    <link rel="stylesheet" href="/andura/andura-fonts.css">
    <link rel="stylesheet" href="/andura/hoptracer-andura.css">
    
    <style>
        :root {
            /* ANDURA Design System */
            --radius: 0;
            --background: #000000;
            --foreground: #DADADD;
            --card: #090A0C;
            --card-foreground: #DADADD;
            --popover: #090A0C;
            --popover-foreground: #DADADD;
            --primary: #3A3CFF;
            --primary-foreground: #DADADD;
            --secondary: #141518;
            --secondary-foreground: #DADADD;
            --muted: #141518;
            --muted-foreground: #8A8C91;
            --accent: #3A3CFF;
            --accent-foreground: #DADADD;
            --destructive: #F45536;
            --border: #3C3D41;
            --input: #3C3D41;
            --ring: #DADADD;

            --bg-app: var(--background);
            --bg-panel: var(--card);
            --text-primary: var(--foreground);
            --text-secondary: var(--muted-foreground);
            --accent-color: var(--primary);
            --accent-hover: #5A74F1;
            --danger: #F45536;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "IBM Plex Sans", sans-serif;
            background-color: var(--bg-app);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 16px;
        }

        .no-glow,
        .no-glow * {
            box-shadow: none !important;
            text-shadow: none !important;
            backdrop-filter: none !important;
        }

        .container {
            width: min(600px, calc(100vw - 32px));
            max-width: 100%;
            text-align: center;
            background: var(--bg-panel);
            padding: clamp(24px, 5vw, 40px);
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        .btn:focus-visible {
            outline: 2px solid var(--ring);
            outline-offset: 2px;
        }

        h1 {
            margin: 0 0 20px 0;
            font-size: 24px;
            font-weight: 700;
            color: var(--danger);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .error-icon {
            width: 32px;
            height: 32px;
        }

        .error-message {
            margin-bottom: 30px;
            font-size: 16px;
            line-height: 1.6;
            color: var(--text-secondary);
            background: rgba(244, 67, 54, 0.1);
            padding: 16px;
            border-radius: 8px;
            border: 1px solid rgba(244, 67, 54, 0.2);
            font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
            word-break: break-all;
        }

        .btn {
            background: var(--accent-color);
            color: var(--primary-foreground);
            border: none;
            padding: 12px 32px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            text-decoration: none;
            display: inline-block;
        }

        .btn:hover {
            background: var(--accent-hover);
        }
    </style>
</head>

<body class="no-glow">
    <main class="container" aria-labelledby="error-title">
        <h1 id="error-title">
            <svg class="error-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z">
                </path>
            </svg>
            Oops! Something went wrong
        </h1>

        <div class="error-message">
            {error_message}
        </div>

        <a href="/" class="btn">Back to Home</a>
    </main>
</body>

</html>
