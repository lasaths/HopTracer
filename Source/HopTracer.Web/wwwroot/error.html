<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - HopTracer</title>
    <link rel="icon" type="image/png" href="/images/HopTrace_Logo.png">
    <link rel="stylesheet" href="/andura/andura-fonts.css">
    <style>
        /* ANDURA Design System - Error Page */
        :root {
            --void: #000000;
            --surface: #090A0C;
            --line: #3C3D41;
            --muted: #8A8C91;
            --text: #DADADD;
            --emergency: #F45536;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "IBM Plex Sans", sans-serif;
            background-color: var(--void);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 16px;
        }

        .no-glow,
        .no-glow * {
            box-shadow: none !important;
            text-shadow: none !important;
            backdrop-filter: none !important;
        }

        .container {
            width: min(600px, calc(100vw - 32px));
            max-width: 100%;
            text-align: center;
            background: var(--surface);
            padding: clamp(24px, 5vw, 40px);
            border-radius: 12px;
            border: 1px solid var(--line);
        }

        .btn:focus-visible {
            outline: 2px solid var(--text);
            outline-offset: 2px;
        }

        h1 {
            margin: 0 0 20px 0;
            font-size: 24px;
            font-weight: 500;
            color: var(--emergency);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .error-icon {
            width: 32px;
            height: 32px;
        }

        .error-message {
            margin-bottom: 30px;
            font-size: 16px;
            line-height: 1.6;
            color: var(--muted);
            background: rgba(244, 67, 54, 0.1);
            padding: 16px;
            border-radius: 8px;
            border: 1px solid rgba(244, 67, 54, 0.2);
            font-family: "IBM Plex Mono", monospace;
            word-break: break-all;
        }

        .btn {
            background: #3A3CFF;
            color: var(--text);
            border: none;
            padding: 12px 32px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            text-decoration: none;
            display: inline-block;
        }

        .btn:hover {
            opacity: 0.9;
        }
    </style>
</head>

<body class="no-glow">
    <main class="container" aria-labelledby="error-title">
        <h1 id="error-title">
            <svg class="error-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z">
                </path>
            </svg>
            Oops! Something went wrong
        </h1>

        <div class="error-message">
            {error_message}
        </div>

        <a href="/" class="btn">Back to Home</a>
    </main>
</body>

</html>
