<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grasshopper Diff Tool</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f1115;
            --panel: #16181d;
            --border: #2a2d36;
            --accent: #5c80f7;
            --text: #eceef5;
            --text-dim: #949aa5;
        }

        body {
            margin: 0;
            font-family: "Geist Sans", "Space Grotesk", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .container {
            width: 800px;
            text-align: center;
        }

        h1 {
            margin-bottom: 40px;
            font-weight: 600;
        }

        .drop-zone-container {
            display: flex;
            gap: 20px;
            margin-bottom: 40px;
        }

        .drop-zone {
            flex: 1;
            height: 200px;
            background: var(--panel);
            border: 2px dashed var(--border);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            cursor: pointer;
            position: relative;
        }

        .drop-zone:hover,
        .drop-zone.dragover {
            border-color: var(--accent);
            background: rgba(92, 128, 247, 0.05);
        }

        .drop-zone input {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .icon {
            width: 48px;
            height: 48px;
            margin-bottom: 16px;
            color: var(--text-dim);
        }

        .label {
            font-size: 14px;
            color: var(--text-dim);
            font-weight: 500;
        }

        .filename {
            margin-top: 10px;
            font-size: 13px;
            color: var(--accent);
            font-weight: 600;
            font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
        }

        .btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px 32px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background: #4b6cdb;
        }

        .btn:disabled {
            background: var(--border);
            cursor: not-allowed;
            color: var(--text-dim);
        }

        .flash-messages {
            margin-bottom: 20px;
            color: #f44336;
            background: rgba(244, 67, 54, 0.1);
            padding: 10px;
            border-radius: 6px;
            display: inline-block;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Grasshopper Diff Tool</h1>

        {% with messages = get_flashed_messages() %}
        {% if messages %}
        <div class="flash-messages">
            {% for message in messages %}
            <div>{{ message }}</div>
            {% endfor %}
        </div>
        {% endif %}
        {% endwith %}

        <form action="/compare" method="post" enctype="multipart/form-data" id="compareForm">
            <div class="drop-zone-container">
                <div style="flex: 1; display: flex; flex-direction: column; gap: 10px;">
                    <div class="drop-zone" id="dropOld">
                        <input type="file" name="file_old" id="fileOld" accept=".ghx,.gh" required>
                        <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z">
                            </path>
                        </svg>
                        <div class="label">Drop OLD .gh/.ghx file here</div>
                        <div class="filename" id="nameOld"></div>
                    </div>
                    <button type="button" class="btn" id="browseOldBtn" style="padding: 8px 16px; font-size: 13px;">
                        Browse for OLD file
                    </button>
                </div>

                <div style="flex: 1; display: flex; flex-direction: column; gap: 10px;">
                    <div class="drop-zone" id="dropNew">
                        <input type="file" name="file_new" id="fileNew" accept=".ghx,.gh" required>
                        <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z">
                            </path>
                        </svg>
                        <div class="label">Drop NEW .gh/.ghx file here</div>
                        <div class="filename" id="nameNew"></div>
                    </div>
                    <button type="button" class="btn" id="browseNewBtn" style="padding: 8px 16px; font-size: 13px;">
                        Browse for NEW file
                    </button>
                </div>
            </div>

            <button type="submit" class="btn" id="compareBtn">Compare Files</button>
        </form>

        <!-- Git History Modal -->
        <div id="gitModal"
            style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.8); z-index:100; align-items:center; justify-content:center;">
            <div
                style="background:var(--panel); padding:0; border-radius:12px; width:800px; height:600px; display:flex; flex-direction:column; overflow:hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.5);">
                
                <div style="padding: 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center;">
                    <h3 style="margin:0;">Select Version from Git History</h3>
                    <button onclick="closeGitModal()" style="background:none; border:none; color:var(--text-dim); cursor:pointer; font-size:20px;">&times;</button>
                </div>

                <div id="gitStatus" style="padding: 16px 20px; color: var(--text-dim); font-size: 14px; min-height: 24px; border-bottom: 1px solid var(--border); background: var(--bg); display: flex; align-items: center; gap: 10px;">
                    <span id="gitStatusText">Select a file to view its Git history...</span>
                </div>

                <div id="commitList"
                    style="flex:1; overflow-y:auto; border:1px solid var(--border); border-radius:6px; margin: 20px;">
                    <!-- Commits injected here -->
                </div>
                
                <div style="display:flex; justify-content:flex-end; gap:10px; padding: 20px; border-top: 1px solid var(--border);">
                    <button class="btn" style="background:transparent; border:1px solid var(--border);"
                        onclick="closeGitModal()">Cancel</button>
                    <button class="btn" id="loadCommitBtn" disabled>Load Selected</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const dropZones = {
            old: { input: document.getElementById('fileOld'), name: document.getElementById('nameOld'), zone: document.getElementById('dropOld') },
            new: { input: document.getElementById('fileNew'), name: document.getElementById('nameNew'), zone: document.getElementById('dropNew') }
        };

        let currentGitPath = null;
        let selectedCommit = null;
        let currentOldFilePath = null;
        const gitStatusText = document.getElementById('gitStatusText');

        // Handle Browse buttons for native file picker
        browseOldBtn.onclick = async () => {
            try {
                const response = await fetch('/api/filepicker/pick-native-file');
                if (response.ok) {
                    const data = await response.json();
                    const path = data.path;
                    const filename = path.split(/[\\/]/).pop();
                    
                    // Update UI
                    dropZones.old.name.textContent = filename;
                    dropZones.old.zone.style.borderColor = 'var(--accent)';
                    
                    // Store the full path for git operations
                    currentOldFilePath = path;
                    currentGitPath = path;
                    cacheLastPath(path);

                    // --- CHANGE: Auto open git modal ---
                    openGitModal();
                    
                    console.log('Selected via native picker:', path);
                } else {
                    alert('No file selected');
                }
            } catch (err) {
                console.error('Error picking file:', err);
                alert('Error opening file picker');
            }
        };

        browseNewBtn.onclick = async () => {
            try {
                const response = await fetch('/api/filepicker/pick-native-file');
                if (response.ok) {
                    const data = await response.json();
                    const path = data.path;
                    const filename = path.split(/[\\/]/).pop();
                    
                    // Update UI
                    dropZones.new.name.textContent = filename;
                    dropZones.new.zone.style.borderColor = 'var(--accent)';
                    
                    console.log('Selected via native picker:', path);
                } else {
                    alert('No file selected');
                }
            } catch (err) {
                console.error('Error picking file:', err);
                alert('Error opening file picker');
            }
        };

        function setupDropZone(type) {
            const { input, name, zone } = dropZones[type];

            input.addEventListener('change', () => handleFileSelect(type, input.files[0]));

            zone.addEventListener('dragover', (e) => {
                e.preventDefault();
                zone.classList.add('dragover');
            });

            zone.addEventListener('dragleave', () => {
                zone.classList.remove('dragover');
            });

            zone.addEventListener('drop', (e) => {
                e.preventDefault();
                zone.classList.remove('dragover');
                if (e.dataTransfer.files.length > 0) {
                    input.files = e.dataTransfer.files;
                    handleFileSelect(type, input.files[0]);
                }
            });
        }

        async function handleFileSelect(type, file) {
            if (!file) return;

            dropZones[type].name.textContent = file.name;
            dropZones[type].zone.style.borderColor = 'var(--accent)';

            // Note: Browser file inputs don't provide full file paths for security reasons
            // Git history is ONLY available when using the "Browse for OLD file" button
            if (type === 'old') {
                console.log('File dropped:', file.name, '(For Git history, use "Browse for OLD file" button instead)');
            }
        }

        function setGitPath(path) {
            if (!path) return;
            currentOldFilePath = path;
            currentGitPath = path;
            cacheLastPath(path);
        }

        function cacheLastPath(path) {
            if (!path) return;
            try {
                localStorage.setItem('hoptracer:lastPath', path);
            } catch (_) { /* ignore */ }
        }

        function setStatus(message, tone = 'muted') {
            if (!gitStatusText) return;
            const colors = {
                muted: 'var(--text-dim)',
                info: 'var(--accent)',
                warn: '#ffb74d',
                error: '#ff6b6b'
            };
            const gitStatus = document.getElementById('gitStatus');
            gitStatus.style.color = colors[tone] || colors.muted;
            gitStatusText.textContent = message || '';
        }

        function setGitLoadingState(message) {
            const list = document.getElementById('commitList');
            const btn = document.getElementById('loadCommitBtn');
            setStatus(message, 'info');
            list.style.pointerEvents = 'none';
            list.style.opacity = '0.6';
            btn.innerText = 'Downloading...';
            btn.disabled = true;
        }

        function clearGitLoadingState() {
            const list = document.getElementById('commitList');
            const btn = document.getElementById('loadCommitBtn');
            list.style.pointerEvents = '';
            list.style.opacity = '';
            btn.innerText = 'Load Selected';
            btn.disabled = false;
        }

        async function openGitModal() {
            document.getElementById('gitModal').style.display = 'flex';
            const list = document.getElementById('commitList');
            
            // If we already have a file path, auto-load commits
            if (currentOldFilePath) {
                setStatus(`Loading commits for ${currentOldFilePath.split(/[\\/]/).pop()}...`, 'info');
                list.innerHTML = '<div style="padding:40px; text-align:center; color:var(--text-dim);"><div style="margin-bottom:12px;">⏳</div>Loading commits...</div>';
                await attemptLoadCommits(currentOldFilePath);
            } else {
                // No file selected yet, show helpful message
                setStatus('Click "Browse for OLD file" on the main screen first', 'warn');
                list.innerHTML = '<div style="padding:40px; text-align:center; color:var(--text-dim);">No file selected.<br><br>Please close this modal and click "Browse for OLD file" first.</div>';
            }
        }

        async function attemptLoadCommits(path) {
            if (!path) {
                setStatus('No file path provided', 'warn');
                return;
            }

            currentGitPath = path;
            const list = document.getElementById('commitList');
            list.innerHTML = '<div style="padding:30px; text-align:center; color:var(--text-dim);"><div style="margin-bottom:8px;">🔍</div>Checking if this is a Git repository...</div>';
            setStatus('Checking repository…', 'info');

            try {
                const ok = await checkRepo(path);
                if (!ok) {
                    setStatus('This file is not in a Git repository', 'warn');
                    list.innerHTML = '<div style="padding:40px; text-align:center; color:#ffb74d;"><div style="font-size:32px; margin-bottom:12px;">⚠️</div><strong>Not a Git Repository</strong><br><br>This file is not tracked in Git.</div>';
                    return;
                }
                fetchCommits(path);
            } catch (err) {
                console.error('Repo check failed', err);
                setStatus('Could not verify repository', 'error');
                list.innerHTML = '<div style="padding:40px; text-align:center; color:#ff6b6b;"><div style="font-size:32px; margin-bottom:12px;">❌</div><strong>Error</strong><br><br>Could not verify repository.</div>';
            }
        }

        async function fetchCommits(path) {
            const list = document.getElementById('commitList');
            list.innerHTML = '<div style="padding:30px; text-align:center; color:var(--text-dim);"><div style="margin-bottom:8px;">📜</div>Loading commit history...</div>';
            
            console.log('Fetching commits for:', path);
            currentGitPath = path;
            setStatus('Loading commits…', 'info');

            try {
                const res = await fetch('/git/commits', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ path: path })
                });
                
                if (!res.ok) {
                    const errorData = await res.json().catch(() => ({ error: res.statusText }));
                    console.error('Fetch error:', errorData);
                    list.innerHTML = `<div style="padding:40px; text-align:center; color:#ff6b6b;"><div style="font-size:32px; margin-bottom:12px;">❌</div><strong>Error</strong><br><br>${errorData.error || 'Failed to load commits'}</div>`;
                    setStatus(errorData.error || 'Failed to load commits', 'error');
                    return;
                }
                
                const data = await res.json();
                console.log('Commits data:', data);

                if (data.error) {
                    list.innerHTML = `<div style="padding:40px; text-align:center; color:#ff6b6b;"><div style="font-size:32px; margin-bottom:12px;">❌</div><strong>Error</strong><br><br>${data.error}</div>`;
                    setStatus(data.error, 'error');
                    return;
                }

                renderCommits(data.commits);
            } catch (e) {
                list.innerHTML = `<div style="padding:40px; text-align:center; color:#ff6b6b;"><div style="font-size:32px; margin-bottom:12px;">❌</div><strong>Error</strong><br><br>Failed to fetch commits</div>`;
                setStatus('Failed to fetch commits', 'error');
            }
        }

        async function checkRepo(path) {
            try {
                const res = await fetch('/git/check', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ path })
                });
                if (!res.ok) return false;
                const data = await res.json();
                return data.is_repo === true;
            } catch {
                return false;
            }
        }

        function renderCommits(commits) {
            const list = document.getElementById('commitList');
            list.innerHTML = '';
            const loadBtn = document.getElementById('loadCommitBtn');
            loadBtn.disabled = true;
            loadBtn.innerText = 'Load Selected';
            selectedCommit = null;
            list.style.pointerEvents = '';
            list.style.opacity = '';

            if (commits.length === 0) {
                list.innerHTML = '<div style="padding:40px; text-align:center; color:var(--text-dim);"><div style="font-size:32px; margin-bottom:12px;">📭</div><strong>No Commits Found</strong><br><br>This file has no Git history.</div>';
                setStatus('No commits found for this file', 'warn');
                return;
            }
            
            setStatus(`Found ${commits.length} commit${commits.length === 1 ? '' : 's'} where this file exists. Select one to compare.`, 'info');

            commits.forEach(c => {
                const item = document.createElement('div');
                item.style.padding = '10px';
                item.style.borderBottom = '1px solid var(--border)';
                item.style.cursor = 'pointer';
                item.style.display = 'flex';
                item.style.justifyContent = 'space-between';
                item.style.alignItems = 'center';

                item.innerHTML = `
                    <div>
                        <div style="font-weight:600; font-size:13px;">${c.message}</div>
                        <div style="font-size:11px; color:var(--text-dim); margin-top:4px;">
                            <span style="color:var(--accent); font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;">${c.hash}</span> • ${c.author} • ${c.date}
                        </div>
                    </div>
                `;

                item.onclick = () => {
                    document.querySelectorAll('#commitList > div').forEach(d => d.style.background = 'transparent');
                    item.style.background = 'rgba(92, 128, 247, 0.1)';
                    selectedCommit = c.hash;
                    loadBtn.disabled = false;
                };
                
                // Double-click to auto-load
                item.ondblclick = () => {
                    selectedCommit = c.hash;
                    if (selectedCommit && currentGitPath) {
                        setGitLoadingState('Downloading file from commit…');
                        postData('/git/view_diff', {
                            path: currentGitPath,
                            hash_old: selectedCommit
                        });
                    }
                };

                list.appendChild(item);
            });
        }

        document.getElementById('loadCommitBtn').onclick = async () => {
            if (!selectedCommit || !currentGitPath) return;
            setGitLoadingState('Downloading file from commit…');

            try {
                postData('/git/view_diff', {
                    path: currentGitPath,
                    hash_old: selectedCommit
                });
            } catch (e) {
                setStatus('Error loading diff', 'error');
                clearGitLoadingState();
            }
        };

        function postData(url, data) {
            const form = document.createElement('form');
            form.method = 'POST';
            form.action = url;

            for (const key in data) {
                const input = document.createElement('input');
                input.type = 'hidden';
                input.name = key;
                input.value = data[key];
                form.appendChild(input);
            }

            document.body.appendChild(form);
            form.submit();
        }

        function closeGitModal() {
            document.getElementById('gitModal').style.display = 'none';
        }

        // Auto-initialize drop zones
        setupDropZone('old');
        setupDropZone('new');
    </script>
</body>

</html>
