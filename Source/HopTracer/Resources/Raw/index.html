<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grasshopper Diff Tool</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f1115;
            --panel: #16181d;
            --border: #2a2d36;
            --accent: #5c80f7;
            --text: #eceef5;
            --text-dim: #949aa5;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .container {
            width: 800px;
            text-align: center;
        }

        h1 {
            margin-bottom: 40px;
            font-weight: 600;
        }

        .drop-zone-container {
            display: flex;
            gap: 20px;
            margin-bottom: 40px;
        }

        .drop-zone {
            flex: 1;
            height: 200px;
            background: var(--panel);
            border: 2px dashed var(--border);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            cursor: pointer;
            position: relative;
        }

        .drop-zone:hover,
        .drop-zone.dragover {
            border-color: var(--accent);
            background: rgba(92, 128, 247, 0.05);
        }

        .drop-zone input {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .icon {
            width: 48px;
            height: 48px;
            margin-bottom: 16px;
            color: var(--text-dim);
        }

        .label {
            font-size: 14px;
            color: var(--text-dim);
            font-weight: 500;
        }

        .filename {
            margin-top: 10px;
            font-size: 13px;
            color: var(--accent);
            font-weight: 600;
        }

        .btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px 32px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background: #4b6cdb;
        }

        .btn:disabled {
            background: var(--border);
            cursor: not-allowed;
            color: var(--text-dim);
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Grasshopper Diff Tool</h1>

        <form action="/compare" method="post" enctype="multipart/form-data" id="compareForm">
            <div class="drop-zone-container">
                <div class="drop-zone" id="dropOld">
                    <input type="file" name="file_old" id="fileOld" accept=".ghx,.gh" required>
                    <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z">
                        </path>
                    </svg>
                    <div class="label">Drop OLD .ghx file here</div>
                    <div class="filename" id="nameOld"></div>
                </div>

                <div class="drop-zone" id="dropNew">
                    <input type="file" name="file_new" id="fileNew" accept=".ghx,.gh" required>
                    <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z">
                        </path>
                    </svg>
                    <div class="label">Drop NEW .ghx file here</div>
                    <div class="filename" id="nameNew"></div>
                </div>
            </div>

            <button type="submit" class="btn" id="compareBtn">Compare Files</button>
        </form>

        <!-- Git History Modal -->
        <div id="gitModal"
            style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.8); z-index:100; align-items:center; justify-content:center;">
            <div
                style="background:var(--panel); padding:20px; border-radius:12px; width:500px; max-height:80vh; display:flex; flex-direction:column;">
                <h3 style="margin-top:0;">Git History</h3>
                <div id="commitList"
                    style="flex:1; overflow-y:auto; margin-bottom:20px; border:1px solid var(--border); border-radius:6px;">
                    <!-- Commits injected here -->
                </div>
                <div style="display:flex; justify-content:flex-end; gap:10px;">
                    <button class="btn" style="background:transparent; border:1px solid var(--border);"
                        onclick="closeGitModal()">Cancel</button>
                    <button class="btn" id="loadCommitBtn">Load Selected</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay"
        style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(15, 17, 21, 0.9); z-index:200; flex-direction:column; align-items:center; justify-content:center;">
        <div style="font-size:24px; font-weight:600; margin-bottom:16px;">Converting & Comparing...</div>
        <div
            style="width: 40px; height: 40px; border: 4px solid var(--border); border-top: 4px solid var(--accent); border-radius: 50%; animation: spin 1s linear infinite;">
        </div>
        <div style="margin-top:16px; color:var(--text-dim); font-size:14px;">This may take a few moments for large
            files.</div>
    </div>

    <script>
        const dropZones = {
            old: { input: document.getElementById('fileOld'), name: document.getElementById('nameOld'), zone: document.getElementById('dropOld') },
            new: { input: document.getElementById('fileNew'), name: document.getElementById('nameNew'), zone: document.getElementById('dropNew') }
        };

        let currentGitPath = null;
        let selectedCommit = null;

        function setupDropZone(type) {
            const { input, name, zone } = dropZones[type];

            input.addEventListener('change', () => handleFileSelect(type, input.files[0]));

            zone.addEventListener('dragover', (e) => {
                e.preventDefault();
                zone.classList.add('dragover');
            });

            zone.addEventListener('dragleave', () => {
                zone.classList.remove('dragover');
            });

            zone.addEventListener('drop', (e) => {
                e.preventDefault();
                zone.classList.remove('dragover');
                if (e.dataTransfer.files.length > 0) {
                    input.files = e.dataTransfer.files;
                    handleFileSelect(type, input.files[0]);
                }
            });
        }

        async function handleFileSelect(type, file) {
            if (!file) return;

            dropZones[type].name.textContent = file.name;
            dropZones[type].zone.style.borderColor = 'var(--accent)';

            if (type === 'old') {
                checkGitStatus(file);
            }
        }

        async function checkGitStatus(file) {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'btn';
            btn.style.marginTop = '10px';
            btn.style.fontSize = '12px';
            btn.style.padding = '6px 12px';
            btn.innerText = 'Select from Git History';
            btn.onclick = () => openGitModal();

            const existing = dropZones.old.zone.querySelector('button');
            if (existing) existing.remove();

            dropZones.old.zone.appendChild(btn);
        }

        function openGitModal() {
            document.getElementById('gitModal').style.display = 'flex';
            const path = prompt("Enter full path to .ghx file to check history:", "C:/Users/lasaths/Downloads/comptest/DataDrop17.ghx");
            if (path) {
                currentGitPath = path;
                fetchCommits(path);
            }
        }

        async function fetchCommits(path) {
            const list = document.getElementById('commitList');
            list.innerHTML = '<div style="padding:20px; text-align:center; color:var(--text-dim);">Loading...</div>';

            try {
                const res = await fetch('/git/commits', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ path: path })
                });
                const data = await res.json();

                if (data.error) {
                    list.innerHTML = `<div style="padding:20px; color:var(--text-dim);">Error: ${data.error}</div>`;
                    return;
                }

                renderCommits(data.commits);
            } catch (e) {
                list.innerHTML = `<div style="padding:20px; color:var(--text-dim);">Failed to fetch commits</div>`;
            }
        }

        function renderCommits(commits) {
            const list = document.getElementById('commitList');
            list.innerHTML = '';

            if (commits.length === 0) {
                list.innerHTML = '<div style="padding:20px; text-align:center; color:var(--text-dim);">No commits found</div>';
                return;
            }

            commits.forEach(c => {
                const item = document.createElement('div');
                item.style.padding = '10px';
                item.style.borderBottom = '1px solid var(--border)';
                item.style.cursor = 'pointer';
                item.style.display = 'flex';
                item.style.justifyContent = 'space-between';
                item.style.alignItems = 'center';

                item.innerHTML = `
                    <div>
                        <div style="font-weight:600; font-size:13px;">${c.message}</div>
                        <div style="font-size:11px; color:var(--text-dim); margin-top:4px;">
                            <span style="color:var(--accent); font-family:monospace;">${c.hash}</span> • ${c.author} • ${c.date}
                        </div>
                    </div>
                `;

                item.onclick = () => {
                    document.querySelectorAll('#commitList > div').forEach(d => d.style.background = 'transparent');
                    item.style.background = 'rgba(92, 128, 247, 0.1)';
                    selectedCommit = c.hash;
                };

                list.appendChild(item);
            });
        }

        document.getElementById('loadCommitBtn').onclick = async () => {
            if (!selectedCommit || !currentGitPath) return;

            const btn = document.getElementById('loadCommitBtn');
            btn.innerText = 'Loading...';
            btn.disabled = true;

            try {
                postData('/git/view_diff', {
                    path: currentGitPath,
                    hash_old: selectedCommit
                });
            } catch (e) {
                alert("Error loading diff");
            } finally {
                btn.innerText = 'Load Selected';
                btn.disabled = false;
                closeGitModal();
            }
        };

        function postData(url, data) {
            const form = document.createElement('form');
            form.method = 'POST';
            form.action = url;

            for (const key in data) {
                const input = document.createElement('input');
                input.type = 'hidden';
                input.name = key;
                input.value = data[key];
                form.appendChild(input);
            }

            document.body.appendChild(form);
            form.submit();
        }

        function closeGitModal() {
            document.getElementById('gitModal').style.display = 'none';
        }

        setupDropZone('old');
        setupDropZone('new');

        document.getElementById('compareForm').addEventListener('submit', () => {
            document.getElementById('loadingOverlay').style.display = 'flex';
        });
    </script>
</body>

</html>
