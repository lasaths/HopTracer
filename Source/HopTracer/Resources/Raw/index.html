<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HopTracer</title>
    <meta http-equiv="refresh" content="0; url=/index.html" />
    <style>
        :root {
            color-scheme: dark;
            --bg: #0f1115;
            --fg: #eceef5;
            --muted: #949aa5;
        }

        body {
            margin: 0;
            height: 100vh;
            display: grid;
            place-items: center;
            background: var(--bg);
            color: var(--fg);
            font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        }

        .card {
            text-align: center;
            padding: 24px;
            border: 1px solid #2a2d36;
            border-radius: 12px;
            background: #16181d;
            max-width: 520px;
        }

        p {
            margin: 0;
            color: var(--muted);
        }

        a {
            color: #7ea3ff;
        }
    </style>
</head>
<body>
    <div class="card">
        <p>Redirecting to HopTracer...</p>
        <p style="margin-top: 8px;">If this does not happen automatically, <a href="/index.html">open the app</a>.</p>
    </div>
</body>
</html>
